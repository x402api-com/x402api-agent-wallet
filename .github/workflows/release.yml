name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm --version
      - run: npm ci
      - run: npm run release:verify -- "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: npm publish --workspace @x402api/agent-wallet-core --access public --provenance
      - run: npm publish --workspace @x402api/agent-wallet-cli --access public --provenance
